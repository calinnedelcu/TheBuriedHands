; Epic Online Services: the keys the game uses to find the other player
; from any network (Epic's servers introduce the two machines and, when no
; direct way exists, relay between them).
;
; Copy this file to eos.cfg (next to project.godot) and fill it in from the
; Epic Developer Portal (dev.epicgames.com/portal), product "The Buried Hands":
;   Product Settings -> SDK Download & Credentials: product, sandbox, deployment ids
;   Product Settings -> Clients: the client id and secret (policy: Peer2Peer)
; eos.cfg is never committed (the repository is public); the export presets
; put it into the builds. Without it the game still plays together on the
; same network and through an open router, as before.

[eos]

product_id=""
sandbox_id=""
deployment_id=""
client_id=""
client_secret=""
